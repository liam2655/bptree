[package]
name = "bptree"
version = "0.1.0"
edition = "2024"

[lib]
name = "bptree"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
criterion = "0.8"
rand = "0.9"
tempfile = "3.15"

[[bench]]
name = "benchmark"
harness = false
