[package]
name = "btree"
version = "0.1.0"
edition = "2024"

[lib]
name = "btree"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tempfile = "3.0"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "benchmark"
harness = false
