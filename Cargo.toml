[package]
name = "bptree"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
tempfile = "3.0"
uuid = { version = "1.0", features = ["v4"] }
madsim = "0.2"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt"] }

[[bench]]
name = "benchmark"
harness = false

[dev-dependencies]
criterion = "0.5"

